<!-- Login A — Mobile counterpart (390 × 844). Centered card on the soft page, logo above; two text links below. -->
<div class="screen mobile v-a lma" data-variant="A" data-mode="light" data-density="comfortable" data-palette="01">
  <div class="m-auth" role="form">
    <!-- @include logo -->
    <div class="auth-card">
      <div><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to your workspace.</p></div>
      <div class="form">
        <div class="field"><label for="lam-email">Work email</label><input class="input" id="lam-email" type="email" placeholder="you@company.com"></div>
        <div class="field"><label for="lam-pass">Password</label><input class="input" id="lam-pass" type="password" placeholder="••••••••••"></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </div>
    </div>
    <div class="m-links"><a href="#">Forgot password?</a><a href="#">Use single sign-on</a></div>
  </div>
</div>
