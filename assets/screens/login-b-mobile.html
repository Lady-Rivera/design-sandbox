<!-- Login B — Mobile counterpart (390 × 844). Brand block on top (B's brand panel, headline only), the form on a sheet that rises over it. -->
<div class="screen mobile v-b lmb" data-variant="B" data-mode="light" data-density="comfortable" data-palette="01">
  <aside class="brand-panel">
    <span class="glow"></span><span class="glow-2"></span>
    <!-- @include logo -->
    <h2>Everything your team needs, in one place.</h2>
  </aside>
  <main class="lmb-sheet" role="form">
    <div><h1 class="auth-title">Sign in</h1><p class="auth-sub">Use your work email to continue.</p></div>
    <div class="form">
      <div class="field"><label for="lbm-email">Work email</label><input class="input" id="lbm-email" type="email" placeholder="you@company.com"></div>
      <div class="field"><label for="lbm-pass">Password</label><input class="input" id="lbm-pass" type="password" placeholder="••••••••••"></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </div>
    <div class="m-links"><a href="#">Forgot password?</a><a href="#">Use single sign-on</a></div>
  </main>
</div>
