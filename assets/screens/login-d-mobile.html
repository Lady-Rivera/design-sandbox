<!-- Login D — Mobile counterpart (390 × 844). Dark frame with a soft glow, floating card with the one-time-code step. -->
<div class="screen mobile v-d lmd" data-variant="D" data-mode="light" data-density="comfortable" data-palette="01">
  <div class="m-auth" role="form">
    <!-- @include logo -->
    <div class="auth-card">
      <div><h1 class="auth-title">Sign in</h1><p class="auth-sub">We'll email you a one-time code.</p></div>
      <div class="form">
        <div class="field"><label for="ldm-email">Work email</label><div class="input"><svg class="icon icon-sm faint"><use href="#i-mail"></use></svg><input id="ldm-email" type="email" placeholder="you@company.com" style="border:0;background:transparent;outline:none;flex:1;min-width:0;"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Continue<svg class="icon icon-sm"><use href="#i-arrow-right"></use></svg></button>
      </div>
    </div>
    <div class="m-links"><a href="#">Use a password instead</a><a href="#">Single sign-on</a></div>
  </div>
</div>
