<!-- Login A — Centered card on a soft page. -->
<div class="screen auth v-a la" data-variant="A" data-mode="light" data-density="comfortable" data-palette="01">
  <div class="la-wrap">
    <div class="la-brand"><!-- @include logo --></div>
    <div class="auth-card la-card" role="form">
      <div><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to your workspace to continue.</p></div>
      <div class="form">
        <div class="field"><label for="la-email">Work email</label><input class="input" id="la-email" type="email" placeholder="you@company.com"></div>
        <div class="field"><label for="la-pass">Password</label><div class="password-wrap"><input class="input" id="la-pass" type="password" placeholder="••••••••••"><button class="eye" type="button" aria-label="Show password"><svg class="icon icon-sm"><use href="#i-eye"></use></svg></button></div></div>
        <div class="form-row"><label class="check"><span class="box"></span>Keep me signed in</label><a href="#">Forgot password?</a></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
      </div>
      <div class="or">or</div>
      <button class="btn btn-outline btn-block sso" type="button"><svg class="icon"><use href="#i-key"></use></svg>Continue with single sign-on</button>
      <p class="auth-foot">New here? <a href="#">Ask your administrator for an invite</a></p>
    </div>
    <div class="legal la-legal"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Help</a></div>
  </div>
</div>
