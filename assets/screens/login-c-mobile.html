<!-- Login C — Mobile counterpart (390 × 844). Form on the surface; a pared-down product preview peeks up from the tinted band below (C's preview side). -->
<div class="screen mobile v-c lmc" data-variant="C" data-mode="light" data-density="comfortable" data-palette="01">
  <main class="lmc-main" role="form">
    <!-- @include logo -->
    <div><h1 class="auth-title display">Sign in to your workspace</h1><p class="auth-sub">Pick up where your team left off.</p></div>
    <div class="form">
      <div class="field"><label for="lcm-email">Work email</label><input class="input" id="lcm-email" type="email" placeholder="you@company.com"></div>
      <div class="field"><label for="lcm-pass">Password</label><input class="input" id="lcm-pass" type="password" placeholder="••••••••••"></div>
      <button class="btn btn-primary btn-block" type="submit">Sign in<svg class="icon icon-sm"><use href="#i-arrow-right"></use></svg></button>
    </div>
    <div class="m-links"><a href="#">Forgot password?</a><a href="#">Use single sign-on</a></div>
  </main>
  <aside class="lmc-band" aria-hidden="true">
    <p class="lc-caption">One workspace for orders, projects and billing.</p>
    <div class="preview">
      <div class="p-main">
        <div class="p-stats"><div class="p-stat"><b>24</b><span>Open orders</span></div><div class="p-stat"><b>11</b><span>Active projects</span></div><div class="p-stat"><b>6</b><span>Pending invoices</span></div></div>
        <div class="p-rows">
          <div class="p-row"><i></i><span class="chip pending">Pending</span><i></i></div>
          <div class="p-row"><i></i><span class="chip progress">In progress</span><i></i></div>
          <div class="p-row"><i></i><span class="chip complete">Complete</span><i></i></div>
        </div>
      </div>
    </div>
  </aside>
</div>
