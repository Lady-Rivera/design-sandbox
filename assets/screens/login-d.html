<!-- Login D — Full-bleed dark frame, compact floating card, passwordless first step. -->
<div class="screen auth v-d ld" data-variant="D" data-mode="light" data-density="comfortable" data-palette="01">
  <div class="ld-grid" aria-hidden="true"></div>
  <div class="ld-wrap">
    <div class="ld-brand"><!-- @include logo --></div>
    <div class="auth-card ld-card" role="form">
      <div><h1 class="auth-title">Sign in</h1><p class="auth-sub">Enter your work email and we'll send a one-time code.</p></div>
      <div class="form">
        <div class="field"><label for="ld-email">Work email</label><div class="input input-lg"><svg class="icon icon-sm faint"><use href="#i-mail"></use></svg><input id="ld-email" type="email" placeholder="you@company.com" style="border:0;background:transparent;outline:none;flex:1;min-width:0;"></div></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Continue<svg class="icon icon-sm"><use href="#i-arrow-right"></use></svg></button>
      </div>
      <div class="or">or</div>
      <div class="form">
        <button class="btn btn-outline btn-block sso" type="button"><svg class="icon"><use href="#i-key"></use></svg>Continue with single sign-on</button>
        <button class="btn btn-ghost btn-block" type="button"><svg class="icon icon-sm"><use href="#i-lock"></use></svg>Sign in with a password instead</button>
      </div>
    </div>
    <p class="ld-foot">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy policy</a>.</p>
    <div class="legal ld-legal"><a href="#">Status</a><a href="#">Help</a><a href="#">Contact</a></div>
  </div>
</div>
