<section class="bottom" aria-label="Tools">
  <div class="card">
    <span class="icon-tile"><svg class="icon"><use href="#i-edit"></use></svg></span>
    <h3 class="card-title"><svg class="icon"><use href="#i-edit"></use></svg>Add internal note</h3>
    <p class="card-sub">Attach a note to an order for your team.</p>
    <input class="input" type="text" placeholder="Order ID (e.g. ORD-1042)" aria-label="Order ID">
    <button class="btn btn-dark btn-block" type="button">Attach note</button>
  </div>
  <div class="card">
    <span class="icon-tile"><svg class="icon"><use href="#i-file"></use></svg></span>
    <h3 class="card-title"><svg class="icon"><use href="#i-file"></use></svg>Invoice statuses</h3>
    <p class="card-sub">Lifecycle badges for the invoice pipeline.</p>
    <div class="legend">
      <div class="row"><span class="chip neutral no-dot">Draft</span><span class="muted">Created but not yet sent</span></div>
      <div class="row"><span class="chip progress no-dot">Open</span><span class="muted">Sent, awaiting payment</span></div>
      <div class="row"><span class="chip complete no-dot">Paid</span><span class="muted">Payment received</span></div>
    </div>
  </div>
  <div class="card">
    <span class="icon-tile"><svg class="icon"><use href="#i-sparkle"></use></svg></span>
    <h3 class="card-title"><svg class="icon"><use href="#i-sparkle"></use></svg>Quick actions</h3>
    <p class="card-sub">Common tasks available from the dashboard.</p>
    <div class="actions">
      <button class="quick" type="button"><svg class="icon"><use href="#i-pie"></use></svg>Generate weekly report</button>
      <button class="quick" type="button"><svg class="icon"><use href="#i-file"></use></svg>Create invoice batch</button>
    </div>
  </div>
</section>
